<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拓-Google</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      padding: 16px;
      color: #1a1a2e;
    }
    h2 { font-size: 18px; margin-bottom: 12px; text-align: center; color: #16213e; }
    .field-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #333; }
    input, select {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 14px; background: #fff; outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #4a6cf7; }
    input:disabled { background: #eee; color: #aaa; }
    .row { display: flex; gap: 8px; }
    .row > .field-group { flex: 1; }
    .checkbox-group {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .checkbox-group label { margin-bottom: 0; cursor: pointer; }
    .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .btn-group {
      display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap;
    }
    button {
      flex: 1; padding: 10px 8px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; color: #fff;
      min-width: 60px;
    }
    #startBtn { background: #2ecc71; }
    #startBtn:hover { background: #27ae60; }
    #startBtn.stopped { background: #e74c3c; }
    #startBtn.stopped:hover { background: #c0392b; }
    #resetBtn { background: #95a5a6; }
    #saveBtn { background: #f39c12; }
    #forceRestoreBtn { background: #3498db; }
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #fff; border-radius: 8px;
      border: 1px solid #e0e0e0; margin-bottom: 12px; font-size: 13px;
    }
    .status-indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-indicator.running { background: #2ecc71; }
    .status-indicator.stopped { background: #e74c3c; }
    .log-box {
      background: #1a1a2e; color: #e0e0e0; font-family: "Courier New", monospace;
      font-size: 12px; padding: 8px; border-radius: 6px; height: 140px;
      overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin-top: 8px;
    }
    .log-box .log-time { color: #888; }
    .log-box .log-success { color: #6fcf97; }
    .log-box .log-error { color: #e74c3c; }
  </style>
</head>
<body>
  <h2>拓元自動搶票</h2>

  <div class="status-bar">
    <span>
      <span class="status-indicator stopped" id="statusDot"></span>
      <span id="statusText">已停止</span>
    </span>
    <span id="stepText">等待啟動</span>
  </div>

  <!-- 新增：會員代碼 / 信用卡輸入框 -->
  <div class="field-group">
    <label for="memberCode">會員代碼 / 信用卡</label>
    <input type="text" id="memberCode" placeholder="請輸入代碼" />
  </div>

  <div class="row">
    <div class="field-group">
      <label for="dateInput">日期/場次</label>
      <input type="text" id="dateInput" placeholder="例如 6/14" />
    </div>
    <div class="field-group">
      <label for="priceInput">價格</label>
      <input type="text" id="priceInput" placeholder="例如 4270" />
    </div>
  </div>

  <div class="checkbox-group">
    <input type="checkbox" id="randomCheck" />
    <label for="randomCheck">隨機價位（勾選後免填價格）</label>
  </div>

  <div class="row">
    <div class="field-group">
      <label for="ticketCount">張數 (1~4)</label>
      <select id="ticketCount">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
      </select>
    </div>
    <div class="field-group">
      <label for="refreshSeconds">刷新 (秒)</label>
      <input type="number" id="refreshSeconds" min="1" max="3600" step="1" value="3" />
    </div>
  </div>

  <div class="btn-group">
    <button id="startBtn">啟動</button>
    <button id="saveBtn">儲存設定</button>
    <button id="resetBtn">重置步驟</button>
    <button id="forceRestoreBtn">強制恢復</button>
  </div>
  <div class="log-box" id="logBox"></div>
  <script src="popup.js"></script>
</body>
</html>
